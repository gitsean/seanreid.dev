name: Build and Deploy

on:
  push:
    branches: [master]
  schedule:
    # Nightly rebuild to refresh the Strava snapshot on /fitness
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Seed with the currently deployed snapshot so a failed sync below
      # still ships the previous data instead of an empty page.
      - name: Seed previous fitness snapshot
        run: cp /var/www/seanreid.dev/html/fitness.json public/fitness.json || true

      - name: Sync Strava and write fitness snapshot
        continue-on-error: true
        run: npm run fitness:snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - name: Build
        run: npx ng build

      - name: Deploy
        run: rsync -a --delete html/ /var/www/seanreid.dev/html/
