# Reference nginx config for the self-hosted mini computer.
# Copy to /etc/nginx/sites-available/seanreid.dev and symlink into
# sites-enabled. See docs/self-hosting-migration.md Phases 2-3.

server {
    listen 80;
    listen [::]:80;
    server_name seanreid.dev www.seanreid.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seanreid.dev www.seanreid.dev;

    ssl_certificate     /etc/ssl/cloudflare/seanreid.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/seanreid.dev.key;

    root /var/www/seanreid.dev/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
